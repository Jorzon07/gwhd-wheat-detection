paths:
  raw_dir: data/raw
  zip_path: data/raw/gwhd_2021.zip
  extract_dir: data/raw/gwhd_2021
  processed_dir: data/processed
  outputs_dir: outputs
  images_dir: null
dataset:
  name: GWHD_2021
  zenodo_record: https://zenodo.org/records/5092309
  zenodo_url: https://zenodo.org/records/5092309/files/gwhd_2021.zip?download=1
  md5: 22b4b542c9ae7e056d7fcdeae9ecaed5
  license: CC-BY-4.0
  image_ext: .png
  expected_image_size:
  - 1024
  - 1024
audit:
  seed: 42
  num_workers: 8
  phash_hamming_threshold: 4
  n_sample_images: 12
  tiny_box_min_side_px: 2
phase2:
  seed: 42
  group_key: location
  targets:
    train: 0.7
    validation: 0.15
    test: 0.15
  audit_run: null
  min_box_side_px: 2
  solver_time_limit_s: 60
  tolerance_pp: 0.5
  max_domain_share: 0.25
  min_countries: 4
  min_country_images: 30
  max_unseen_country_share: 0.5
  output_dir: data/splits
phase3:
  seed: 0
  split_dir: data/splits/cv/grouped_k3_f2
  images_dir: data/raw/gwhd_2021/images
  image_size: 1024
  aug:
    hflip: 0.5
    vflip: 0.5
    rot90: 0.5
    brightness: 0.2
    contrast: 0.2
    scale_crop_p: 0.5
    crop_min_frac: 0.6
    min_visibility: 0.5
    min_box_side: 2.0
  loader:
    batch_size: 4
    num_workers: 4
    pin_memory: true
    cache_items: 0
train:
  seed: 0
  arch: frcnn
  variant: v1
  pretrained: true
  trainable_backbone_layers: 3
  image_size: 800
  batch_size: 4
  accum_steps: 1
  epochs: 12
  optimizer: sgd
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0001
  warmup_steps: 300
  min_lr_ratio: 0.01
  grad_clip: 10.0
  backbone_lr_mult: 0.1
  amp: true
  detections_per_img: 300
  score_thresh_eval: 0.001
  nms_thresh: 0.5
  selection_metric: map50_95
  patience: 0
  eval_every: 2
  eval_batch_size: 4
  log_every: 20
  train_images: null
  runs_dir: outputs/runs
